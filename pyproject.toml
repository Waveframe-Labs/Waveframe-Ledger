[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-ledger"
version = "0.9.0"
description = "Governance compiler and semantic derivation infrastructure for deterministic governance operationalization."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "Waveframe Labs" }
]

dependencies = [
    "cricore-contract-compiler>=0.5.0,<0.6.0",
]

[project.optional-dependencies]
guard = [
    "waveframe-guard>=0.19.0,<0.20.0"
]
dev = [
    "pytest>=7",
    "jsonschema>=4",
    "tomli>=2; python_version < '3.11'"
]

[tool.waveframe.guard-compatibility]
status = "pending-release-coordination"
ledger = "0.9.0"
guard = "0.19.0"
guard_ledger_requirement = ">=0.9.0,<0.10.0"
install_compatibility = "pending"
execution_compatibility = "pending"

[project.scripts]
governance-ledger = "governance_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["governance_ledger*"]
exclude = [
    "policies*",
    "generated*",
    "reviews*",
    "contracts*",
    "snapshots*",
    "schemas*",
    "tests*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["temp_core"]
