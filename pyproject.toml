[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-ledger"
version = "0.8.0"
description = "Governance compiler and semantic derivation infrastructure for deterministic governance operationalization."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "Waveframe Labs" }
]

dependencies = [
    "cricore-contract-compiler>=0.4.0",
]

[project.optional-dependencies]
guard = [
    "waveframe-guard==0.17.0"
]
dev = [
    "pytest>=7",
    "jsonschema>=4"
]

[tool.waveframe.guard-compatibility]
status = "release-compatible"
ledger = "0.8.0"
guard = "0.17.0"
guard_ledger_requirement = ">=0.7.0,<0.9.0"
release_tested_extra = "waveframe-guard==0.17.0"

[project.scripts]
governance-ledger = "governance_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["governance_ledger*"]
exclude = [
    "policies*",
    "generated*",
    "reviews*",
    "contracts*",
    "snapshots*",
    "schemas*",
    "tests*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["temp_core"]
