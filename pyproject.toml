[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-ledger"
version = "0.8.0.dev0"
description = "Governance compiler and semantic derivation infrastructure for deterministic governance operationalization."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

authors = [
    { name = "Waveframe Labs" }
]

dependencies = [
    "cricore-contract-compiler>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jsonschema>=4"
]

[tool.waveframe.guard-compatibility]
status = "release-blocked"
last_resolvable_ledger = "0.7.0"
last_resolvable_guard = "0.16.1"
guard_ledger_requirement = ">=0.7.0,<0.8.0"
required_before_ledger_0_8_release = "Release a Guard version tested with Ledger 0.8, restore the guard extra to that exact version, and pass clean extra installation plus pip check."

[project.scripts]
governance-ledger = "governance_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["governance_ledger*"]
exclude = [
    "policies*",
    "generated*",
    "reviews*",
    "contracts*",
    "snapshots*",
    "schemas*",
    "tests*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["temp_core"]
