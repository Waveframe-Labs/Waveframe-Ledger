name: Security patch distribution acceptance

on:
  workflow_dispatch:
    inputs:
      ledger_head:
        description: Exact Ledger release PR head (full SHA)
        required: true
      ledger_pr:
        description: Ledger release PR number
        required: true
      guard_head:
        description: Exact Guard release PR head (full SHA)
        required: true
        default: 78c606526ecb338c48e1d025257d47481a0bc3c4
      guard_pr:
        description: Guard release PR number
        required: true
        default: '70'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-patch-release.yml'
      - 'tools/run_security_patch_release_acceptance.py'
      - 'tests/test_security_patch_release_acceptance.py'
      - 'docs/SECURITY_PATCH_RELEASE_ACCEPTANCE.md'
      - 'pyproject.toml'

permissions:
  contents: read

env:
  LEDGER_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ledger_head }}
  LEDGER_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.ledger_pr }}
  GUARD_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.guard_head || '78c606526ecb338c48e1d025257d47481a0bc3c4' }}
  GUARD_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.guard_pr || '70' }}
  PYTHONUTF8: '1'

jobs:
  distributions:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/security-')
    name: Security patch distributions / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.LEDGER_HEAD }}
          path: ledger
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Waveframe-Labs/Waveframe-Guard
          ref: ${{ env.GUARD_HEAD }}
          path: guard
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the existing pinned test toolchain
        run: python -m pip install -r ledger/requirements-ci.txt
      - name: Validate actual distributions and exact pair provenance
        working-directory: ledger
        shell: bash
        run: >-
          python tools/run_security_patch_release_acceptance.py
          --ledger-head "$LEDGER_HEAD" --ledger-pr "$LEDGER_PR"
          --guard-head "$GUARD_HEAD" --guard-pr "$GUARD_PR"
          --guard-root "$GITHUB_WORKSPACE/guard" --output "$RUNNER_TEMP/security-patch-evidence"
      - name: Retain candidate bytes and every failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-patch-${{ env.LEDGER_HEAD }}-${{ env.GUARD_HEAD }}-${{ matrix.os }}-py${{ matrix.python }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/security-patch-evidence/*.json
            ${{ runner.temp }}/security-patch-evidence/*.log
            ${{ runner.temp }}/security-patch-evidence/*.xml
            ${{ runner.temp }}/security-patch-evidence/*.txt
            ${{ runner.temp }}/security-patch-evidence/ledger-dist/*
            ${{ runner.temp }}/security-patch-evidence/guard-dist/*
            ${{ runner.temp }}/security-patch-evidence/ledger-sdist-wheel/*
            ${{ runner.temp }}/security-patch-evidence/guard-sdist-wheel/*
            ${{ runner.temp }}/security-patch-evidence/published-compiler/*

  aggregate:
    name: Security patch distributions / complete four-cell evidence
    needs: distributions
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/security-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.LEDGER_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ci.txt
      - uses: actions/download-artifact@v6
        with:
          pattern: security-patch-${{ env.LEDGER_HEAD }}-${{ env.GUARD_HEAD }}-*-attempt${{ github.run_attempt }}
          path: cell-evidence
      - name: Require complete exact-pair evidence (no historical certification)
        shell: bash
        run: >-
          python tools/run_security_patch_release_acceptance.py
          --ledger-head "$LEDGER_HEAD" --ledger-pr "$LEDGER_PR"
          --guard-head "$GUARD_HEAD" --guard-pr "$GUARD_PR"
          --aggregate cell-evidence --output security-patch-matrix.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-patch-matrix-${{ env.LEDGER_HEAD }}-${{ env.GUARD_HEAD }}-attempt${{ github.run_attempt }}
          path: security-patch-matrix.json
          if-no-files-found: error
