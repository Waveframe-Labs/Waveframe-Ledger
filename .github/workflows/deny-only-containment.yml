name: Deny-only containment acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ledger_commit:
        description: Exact Ledger PR 27 head (40-character SHA)
        required: true
        type: string

permissions:
  contents: read

env:
  LEDGER_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ledger_commit }}
  GUARD_HEAD: e77c7fb718009b947daba621155baa43315fa045
  PYTHONUTF8: '1'

jobs:
  containment:
    name: Deny-only containment / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.LEDGER_HEAD }}
          path: ledger
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Waveframe-Labs/Waveframe-Guard
          ref: ${{ env.GUARD_HEAD }}
          path: guard
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build and test tools
        run: python -m pip install -r ledger/requirements-ci.txt
      - name: Independently validate exact containment candidates
        working-directory: ledger
        shell: bash
        run: >-
          python tools/run_deny_only_containment_acceptance.py
          --expected-ledger "$LEDGER_HEAD"
          --guard-root "$GITHUB_WORKSPACE/guard"
          --output "$RUNNER_TEMP/containment-evidence"
      - name: Retain exact provenance and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: containment-${{ env.LEDGER_HEAD }}-${{ env.GUARD_HEAD }}-${{ matrix.os }}-py${{ matrix.python }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/containment-evidence/*.json
            ${{ runner.temp }}/containment-evidence/*.log
            ${{ runner.temp }}/containment-evidence/*.xml
            ${{ runner.temp }}/containment-evidence/*.txt
            ${{ runner.temp }}/containment-evidence/ledger-dist/*
            ${{ runner.temp }}/containment-evidence/guard-dist/*

  aggregate:
    name: Deny-only containment / complete four-cell evidence
    needs: containment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.LEDGER_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v6
        with:
          pattern: containment-${{ env.LEDGER_HEAD }}-${{ env.GUARD_HEAD }}-*
          path: cell-evidence
      - name: Require all four exact-head results
        if: always()
        run: >-
          python tools/run_deny_only_containment_acceptance.py
          --expected-ledger "${{ env.LEDGER_HEAD }}"
          --aggregate cell-evidence --output containment-acceptance.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: containment-matrix-${{ env.LEDGER_HEAD }}-${{ env.GUARD_HEAD }}
          path: containment-acceptance.json
          if-no-files-found: error
