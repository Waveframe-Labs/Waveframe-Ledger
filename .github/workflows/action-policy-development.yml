name: Action policy catalog acceptance

on:
  pull_request:
    branches: [main, feat/issue-17-action-authority-dev, feat/issue-19-compiler-acceptance, feat/issue-21-release-catalog, feat/issue-23-ledger-090]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character Ledger commit to validate (required, no branch fallback)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-acceptance:
    name: Source, installed and combined (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.commit }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned acceptance tools
        run: python -m pip install -r requirements-ci.txt
      - name: Verify immutable candidate archives and build provenance
        shell: bash
        run: python tools/fetch_guard_candidate.py --cell "${{ runner.os == 'Windows' && 'windows' || 'ubuntu' }}-${{ matrix.python }}" --output runtime/issue25-inputs
      - name: Validate actual head, source, packages, resolver and historical runtimes
        shell: bash
        run: python tools/run_action_policy_acceptance.py --expected-head "$EXPECTED_HEAD" --output runtime/issue25-base --verified-inputs runtime/issue25-inputs/verified-inputs.json
      - name: Required combined suites, repository execution and ordinary Guard upgrade
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ledger-candidate-input.py" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          
          sys.path.insert(0, str(Path.cwd() / "tools"))
          import run_guard_extra_acceptance as producer
          
          
          class CandidateInputAcceptance(producer.Acceptance):
              """Keep the full existing producer; explicitly supply its verified input."""
          
              def run(self, label, *args, **kwargs):
                  if label == "guard-entry-upgrade":
                      assert "--upgrade" in args and "--find-links" in args
                      compiler = self.output / "wheelhouse" / self.report["compiler_origin"]["filename"]
                      expected = self.report["compiler_origin"]["sha256"]
                      assert hashlib.sha256(compiler.read_bytes()).hexdigest() == expected
                      self.report["release_candidate_input"] = {
                          "scope": "guard-entry-upgrade only",
                          "reason": "Public Compiler 0.5.0 now exists; this gate requires the retained candidate archive",
                          "wheel": str(compiler), "sha256": expected,
                          "public_installation": False,
                      }
                      # Ordinary pip resolution with the same authenticated wheel used by
                      # the combined suites. No metadata, origins, tests or exit codes change.
                      args = (*args, compiler)
                  return super().run(label, *args, **kwargs)
          
          
          producer.Acceptance = CandidateInputAcceptance
          producer.main()
          PY
          python "$RUNNER_TEMP/ledger-candidate-input.py" --expected-head "$EXPECTED_HEAD" --base-evidence runtime/issue25-base --verified-inputs runtime/issue25-inputs/verified-inputs.json --output runtime/issue25-combined
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue25-${{ matrix.os }}-py${{ matrix.python }}-${{ env.EXPECTED_HEAD }}
          if-no-files-found: error
          path: |
            runtime/issue25-base/*.json
            runtime/issue25-base/*.log
            runtime/issue25-base/*.xml
            runtime/issue25-base/*.whl
            runtime/issue25-base/dist/*
            runtime/issue25-combined/*.json
            runtime/issue25-combined/*.log
            runtime/issue25-combined/*.xml
            runtime/issue25-combined/wheelhouse/*
            runtime/issue25-inputs/handoff.json
            runtime/issue25-inputs/SHA256SUMS
            runtime/issue25-inputs/verified-inputs.json
            runtime/issue25-inputs/artifacts/*
