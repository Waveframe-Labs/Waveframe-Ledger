name: Action policy development acceptance

on:
  workflow_dispatch:

jobs:
  candidate-acceptance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      WAVEFRAME_LEDGER_ACTION_POLICY_DEV: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact compiler development candidate
        run: python -m pip install -e ".[dev]" -r requirements-action-policy-dev.txt build twine
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
