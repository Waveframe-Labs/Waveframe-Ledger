name: Governance-Ledger

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Install released Guard compatibility target
        # Guard 0.16.1 declares Ledger <0.8.0, which intentionally excludes this
        # 0.8.0.dev0 checkout. Install its runtime dependencies normally and the
        # exact released Guard wheel without dependency resolution so this job can
        # still prove binary/runtime compatibility. A Guard metadata widening is a
        # separately owned release requirement.
        run: |
          python -m pip install cricore cricore-proposal-normalizer requests
          python -m pip install --no-deps waveframe-guard==0.16.1

      - name: Test released Guard compatibility
        run: python -m pytest tests/test_guard_optional_compatibility.py -q

      - name: Generate draft governance artifacts
        run: governance-ledger run policies --pr-summary governance-review-summary.md

      - name: Check validation severity gate
        run: governance-ledger check generated

      - name: Upload governance review summary
        uses: actions/upload-artifact@v6
        with:
          name: governance-review-summary
          path: governance-review-summary.md
