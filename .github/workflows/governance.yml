name: Governance-Ledger

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  test-without-guard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install base package and test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e ".[dev]" -r requirements-action-policy-dev.txt
          python -m pip check
          python tools/check_compiler_provenance.py

      - name: Confirm Guard is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('waveframe_guard') is None"

      - name: Run full suite without Guard
        run: python -m pytest -q

  release-artifacts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build and check wheel and sdist
        run: |
          python -m pip install -r requirements-ci.txt
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/requirements-ci.txt"
          python -m build
          python -m twine check --strict dist/*

      - name: Clean-install base wheel
        run: |
          release_root="$(mktemp -d)"
          release_env="$release_root/venv"
          python -m venv "$release_env"
          release_python="$release_env/bin/python"
          ledger_wheel="$(python -c "import pathlib,tomllib; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; wheels=list(pathlib.Path('dist').glob('*.whl')); assert len(wheels)==1 and wheels[0].name.startswith(f'governance_ledger-{v}-'), wheels; print(wheels[0])")"
          "$release_python" -m pip install "${ledger_wheel}" -r requirements-action-policy-dev.txt -r requirements-ci.txt
          "$release_python" -m pip check
          "$release_python" -I tools/check_compiler_provenance.py
          "$release_python" -c "import importlib.metadata as m; import governance_ledger, importlib.util; import pathlib,tomllib; assert m.version('governance-ledger') == tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert importlib.util.find_spec('waveframe_guard') is None"
          example_root="$(mktemp -d)"
          (cd "$example_root" && "$release_python" "$GITHUB_WORKSPACE/examples/native_v4_release.py")
