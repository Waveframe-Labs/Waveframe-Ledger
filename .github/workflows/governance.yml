name: Governance-Ledger

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  test-without-guard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install base package and test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e ".[dev]" -r requirements-action-policy-dev.txt
          python -m pip check
          python tools/check_compiler_provenance.py

      - name: Confirm Guard is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('waveframe_guard') is None"

      - name: Run full suite without Guard
        run: python -m pytest -q

  test-with-guard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install candidate with historical Guard extra
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e ".[dev,guard]" -r requirements-action-policy-dev.txt
          python -m pip check
          python tools/check_compiler_provenance.py

      - name: Confirm unchanged development version and legacy Guard pin
        run: python -c "import importlib.metadata as m; assert m.version('governance-ledger') == '0.8.0'; assert m.version('waveframe-guard') == '0.17.0'"

      - name: Run full suite with Guard
        run: python -m pytest -q

      - name: Generate draft governance artifacts
        run: governance-ledger run policies --pr-summary governance-review-summary.md

      - name: Check validation severity gate
        run: governance-ledger check generated

      - name: Upload governance review summary
        uses: actions/upload-artifact@v6
        with:
          name: governance-review-summary
          path: governance-review-summary.md

  release-artifacts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build and check wheel and sdist
        run: |
          python -m pip install -r requirements-ci.txt
          export PIP_CONSTRAINT="$GITHUB_WORKSPACE/requirements-ci.txt"
          python -m build
          python -m twine check --strict dist/*

      - name: Clean-install wheel with Guard extra
        run: |
          release_root="$(mktemp -d)"
          release_env="$release_root/venv"
          python -m venv "$release_env"
          release_python="$release_env/bin/python"
          ledger_wheel="$(find dist -maxdepth 1 -name 'governance_ledger-0.8.0-*.whl' -print -quit)"
          "$release_python" -m pip install "${ledger_wheel}[guard]" -r requirements-action-policy-dev.txt -r requirements-ci.txt
          "$release_python" -m pip check
          "$release_python" -I tools/check_compiler_provenance.py
          "$release_python" -c "import importlib.metadata as m; import governance_ledger, waveframe_guard; assert m.version('governance-ledger') == '0.8.0'; assert m.version('waveframe-guard') == '0.17.0'"
          example_root="$(mktemp -d)"
          (cd "$example_root" && "$release_python" "$GITHUB_WORKSPACE/examples/native_v3_multi_control.py")
